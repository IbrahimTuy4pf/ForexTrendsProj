[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-forex-ai"
version = "0.11.0"
description = "Educational quantitative forex research platform (Phase 11: dashboard)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Quant Forex Research" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
ml = [
    "scikit-learn>=1.5",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dashboard = [
    "streamlit>=1.36",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.scripts]
quant-forex = "quant_forex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
